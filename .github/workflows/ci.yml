name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  infrastructure:
    name: Azure deployment guards and templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment requires explicit opt-in and scope
        shell: pwsh
        run: ./scripts/test-deployment.ps1
      - run: az bicep install
      - run: az bicep build --file infrastructure/azure/bootstrap.bicep --stdout > /dev/null
      - run: az bicep build --file infrastructure/azure/apps.bicep --stdout > /dev/null

  rust:
    name: Rust format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  web:
    name: Next.js typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
