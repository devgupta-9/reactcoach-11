[package]
name = "reactcoach-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
reactcoach-shared = { path = "../../crates/shared" }
reactcoach-match-engine = { path = "../../crates/match-engine" }
reactcoach-decision-engine = { path = "../../crates/decision-engine" }
reactcoach-agents = { path = "../../crates/agents" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
