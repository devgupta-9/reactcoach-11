[package]
name = "reactcoach-agents"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
reactcoach-match-engine = { path = "../match-engine" }
reactcoach-decision-engine = { path = "../decision-engine" }
reactcoach-shared = { path = "../shared" }
sha2 = "0.10.9"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"], optional = true }

[features]
foundry = ["dep:reqwest", "dep:tokio"]

[[bin]]
name = "foundry-demo"
path = "src/bin/foundry-demo.rs"
required-features = ["foundry"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
